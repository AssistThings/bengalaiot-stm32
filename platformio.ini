; Clone bengalaiot-core ao lado deste repositório.
[platformio]
src_dir = src
default_envs = board

[env:board]
platform = ststm32
board = nucleo_wb55rg_p
framework = arduino
lib_deps =
  symlink://../bengalaiot-core
  stm32duino/STM32duinoBLE
  stm32duino/STM32duino RTC
monitor_speed = 115200

[env:conformance]
extends = env:board
build_flags = -DBENGALA_CONFORMANCE
